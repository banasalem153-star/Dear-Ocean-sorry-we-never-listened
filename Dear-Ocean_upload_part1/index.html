const A=[
["shark","","Shark","#7cc1ea","I'm not the monster you think I am.","Sharks are dangerous animals that hunt humans.","Misleading",
["Hi, I'm a shark. Yes, the movies gave me a scary soundtrack, but humans aren't on my menu. NOAA notes that people aren't part of a shark's natural diet, and unprovoked encounters are extremely rare.","Most shark species are no threat to you at all. I keep the ocean balanced by eating sick and weak animals, which keeps reefs healthy. So next time the dramatic music plays, remember: I'm just looking for a fish lunch."]],
["dolphin","","Dolphin","#8fe0ee","I'm not always the perfect friend.","Dolphins are always friendly, harmless and playful.","Incomplete",
["Hello! I'm a dolphin, and yes, I love to leap, whistle and play. But the postcards leave out the messy part: I'm a wild animal with a complicated social life.","Scientists have documented aggressive behavior in dolphins in some situations, and National Geographic points out that our friendly image is only half the story. I'm smart, curious and playful, but not a cartoon. Respect my space, and I'll happily respect yours."]],
["octopus","","Octopus","#f6a0b4","I'm not just a weird sea creature.","Octopuses are strange, simple sea creatures.","Underestimated",
["Greetings from eight arms! People call me weird. I call myself clever. Educational sources like the RSPCA note that I can recognize different humans and behave differently around them.","My cousin the mimic octopus can imitate other animals to fool predators, and I can change my color and skin texture to vanish into the reef. I even have three hearts and blue blood. Weird? I prefer brilliantly unusual."]],
["jellyfish","","Jellyfish","#c6b0f0","I'm more than a sting.","All jellyfish are dangerous.","Misleading",
["Hi, I drift. No brain, no bones, no problem. Everyone hears jellyfish and thinks ouch, but there are many different species and we are very different from each other.","Some of us sting hard, many barely bother people at all, and some glow in the dark water like tiny lanterns. My family has been floating around for hundreds of millions of years. Please don't judge all of us by one bad beach day."]],
["turtle","","Sea Turtle","#8ee0b4","I'm not just the cute one.","Sea turtles are cute, harmless movie characters.","Oversimplified",
["Hello, slow and steady here. I'm a sea turtle, and I'm much more than the cute sidekick from the movies. I can swim thousands of kilometres across oceans, and many of us return to the beach where we were born to nest.","I have a job too: green turtles graze seagrass so meadows stay healthy, and leatherbacks eat jellyfish. My biggest troubles are plastic and fishing gear. Please help me out!"]],
["whale","","Whale","#8db6f2","Yes, I'm huge. That doesn't make me a monster.","Whales shoot water out of their lungs.","Myth",
["I'm a whale. Yes, I'm enormous, but big doesn't mean scary. Many of my relatives are gentle filter-feeders, and my blue whale cousin is the largest animal known to science.","About my spout: NOAA explains it isn't water coming from my lungs. My blowhole works like your nose, and the spray comes from my warm breath and the water around the blowhole. I'm a mammal, so I breathe air, just like you."]],
["seal","","Seal","#b4cfdf","Cute doesn't mean I have no wild side.","Seals are cuddly, human-like pets of the sea.","Oversimplified",
["Hi! I'm a seal. I know, big eyes, whiskers, the whole cute package. But cute is a face, not a personality. People often turn animals into human-like characters, and I am not a plush toy.","I'm a wild predator who dives deep after fish and squid. I'm happiest resting on rocks between hunts. Please admire me from a distance and let me nap in peace."]],
["crab","","Crab","#ffae88","I walk sideways. So what?","All crabs walk sideways and are grumpy.","Partly true",
["Yes, I walk sideways. So what? My leg joints bend sideways, so scuttling is simply efficient. It isn't a funny dance, it's engineering.","The truth is I'm more varied than the stereotype, because some crab species move forward or in other directions. I also grow by shedding my hard shell, and I tidy the seafloor by eating leftovers. Grumpy? No, just busy."]],
["starfish","","Starfish","#ffc974","I'm not even a fish.","A starfish is a type of fish.","Myth",
["Surprise: I'm not a fish. I have no gills, no fins and no backbone. Scientists prefer the name sea star, and honestly, so do I.","I'm an echinoderm, a cousin of sea urchins and sand dollars. I move on hundreds of tiny tube feet, and if I lose an arm I can often grow a new one. Fish can't do that."]],
["orca","","Orca","#9fb9d6","Am I the ocean's villain?","Orcas are killer whales: ruthless ocean villains.","Misleading",
["Am I the ocean's villain? Humans named me killer whale, which sounds very dramatic. In truth, I'm the largest member of the dolphin family.","I live with my family in tight pods, we talk with our own calls, and we hunt as a team. Films turned me into a movie monster, but real orcas are family animals with a bad nickname."]]];

const B=`Manta Ray|Manta rays are dangerous stingers.|I have no stinger at all. I glide through the water filtering plankton, and I have one of the biggest brains among fish.
Stingray|Stingrays attack people.|I only use my tail spine to defend myself when I'm stepped on. Shuffle your feet in shallow water and we'll never have a problem.
Clownfish|Clownfish are just cartoon stars.|A coating of mucus protects me from my anemone's stings. I live safely in its tentacles and help keep my home clean.
Seahorse|Seahorses are delicate and boring.|I'm a fish, and it's the dad who carries the babies in a pouch until they're born. My curled tail grips seagrass like a hand.
Moray Eel|Moray eels are aggressive monsters.|I'm actually shy. I spend most of my day tucked into a crevice, and I bite mainly when I feel threatened.
Barracuda|Barracudas attack swimmers.|I'm fast and curious, so I sometimes follow divers. Attacks on people are very rare.
Pufferfish|Pufferfish are funny balloons.|I gulp water to puff up and scare predators. Many of us also carry a powerful toxin, so I'm no toy.
Lionfish|Lionfish are harmless and pretty.|My spines are venomous. Where I've been introduced, like the Atlantic, I'm an invader that harms reef fish.
Blue-Ringed Octopus|Small animals can't be dangerous.|I fit in your palm, but I'm venomous. My bright blue rings are a warning, so please admire me from far away.
Sea Otter|Sea otters are just cute.|I use rocks as tools to crack open shellfish, and my thick fur, not blubber, keeps me warm.
Walrus|Walruses are clumsy lumps.|My tusks help me haul out onto ice, and my whiskers find clams on the dark seafloor.
Manatee|Manatees are the mermaids of legend.|Sailors once mistook me for a mermaid! I'm a gentle plant-eater, and my closest relatives include elephants.
Narwhal|A narwhal's tusk is a unicorn horn.|My tusk is a long spiral tooth packed with nerve endings, and it helps me sense my icy Arctic home.
Beluga|Belugas are just white dolphins.|I'm a whale, and I'm so chatty that people call me the canary of the sea.
Humpback Whale|Whale songs are random noise.|Male humpbacks sing long, complex songs that change over time, and other whales learn the new tunes.
Sperm Whale|Sperm whales are mindless giants.|I dive deep to hunt squid, and I have the biggest brain of any animal on Earth.
Whale Shark|Whale sharks are whales.|I'm a fish, the biggest in the sea, and I'm a gentle filter-feeder that eats tiny plankton.
Hammerhead Shark|Hammerheads are weird mutants.|My wide head spreads my senses apart, which helps me detect prey and gives me a broad view.
Nurse Shark|All sharks must keep swimming to live.|I rest calmly on the seafloor and pump water over my gills. Sleepy, not scary.
Sea Urchin|Sea urchins are just spiky balls.|I graze on algae, and my spines protect me. I also have tiny tube feet hiding between them.
Sea Cucumber|Sea cucumbers are vegetables.|I'm an animal! I clean the seafloor by eating tiny scraps and recycling them back into the sand.
Sea Anemone|Anemones are plants.|I'm an animal related to jellyfish and coral, and my tentacles carry tiny stinging cells.
Coral|Corals are just colorful rocks.|I'm made of thousands of tiny animals called polyps, and together we build whole reefs.
Sponge|Sponges are plants.|I'm one of the simplest animals. I have no brain, and I filter water to catch food.
Nautilus|Nautiluses are only fossils.|I'm very much alive! I'm a relative of octopuses, and my shell's chambers help me float.
Giant Squid|Giant squids are sea monsters.|I'm real, but I'm rarely seen. My eyes are huge for seeing in the dark deep, and the kraken legend is just that.
Cuttlefish|Cuttlefish are just squid.|I'm my own kind of animal with an inner cuttlebone, and I can ripple my skin through many colors.
Hermit Crab|Hermit crabs grow their own shells.|I borrow empty shells and move into a bigger one when I grow.
Lobster|Lobsters are naturally bright red.|I'm usually a dark color. I turn red only when I'm cooked.
Mantis Shrimp|Mantis shrimp are ordinary shrimp.|I punch so fast that I can crack shells, and my eyes are among the most complex in the ocean.
Krill|Krill are tiny and unimportant.|I'm a small crustacean, but huge swarms of us feed whales, penguins and fish. The ocean runs on us.
Barnacle|Barnacles are shellfish like clams.|I'm actually a crustacean, a relative of crabs, glued headfirst to rocks and boats.
Horseshoe Crab|Horseshoe crabs are crabs.|I'm closer to spiders than crabs, and my family is older than the dinosaurs.
Parrotfish|Parrotfish are just colorful.|I munch algae off coral with my beak-like teeth, and much of the sand on tropical beaches comes from my leftovers.
Anglerfish|Anglerfish are evil deep-sea monsters.|My glowing lure helps me attract food in total darkness. I'm just a hungry fish in a dark world.
Flying Fish|Flying fish really fly.|I leap and glide on my wing-like fins to escape predators, but I don't flap like a bird.
Swordfish|Swordfish stab their prey.|My bill is used to slash at fish and stun them, not to spear them.
Tuna|Tuna are just canned food.|I'm a fast, powerful swimmer that crosses entire oceans.
Ocean Sunfish|The ocean sunfish is a lazy blob.|I'm the heaviest bony fish. I look odd, but I'm a fine swimmer that loves jellyfish.
Penguin|Penguins are failed birds.|My wings are flippers! I can't fly, but I'm a fast swimmer.
Sea Snake|All sea snakes are deadly attackers.|I'm venomous, yet I'm usually calm and rarely bite people.
Marine Iguana|Iguanas don't swim.|I'm the only lizard that feeds in the sea. I dive to graze on algae.
Elephant Seal|Seals are all small and cuddly.|I'm a heavyweight who dives deep for long stretches. Males like me can weigh over a tonne.
Sea Lion|Sea lions are seals.|I'm a cousin of seals. I have visible ear flaps, and I can walk on my big front flippers.
Porpoise|Porpoises are dolphins.|I'm in a different family, with a blunt snout and a smaller body.
Cleaner Wrasse|Small fish are only prey.|I run a cleaning station on the reef, and big fish line up to have their parasites removed by me.
Remora|Remoras are parasites.|I hitch rides on sharks with my suction disc, and I eat the scraps and parasites. Everyone gets a meal.
Portuguese Man o' War|A man o' war is a jellyfish.|I'm actually a colony of tiny animals working together as one, and my tentacles can sting painfully.
Nudibranch|Sea slugs are boring and slimy.|I'm a colorful sea slug, and some of us even recycle stinging cells from the animals we eat.
Dugong|Dugongs are manatees.|I'm a cousin of manatees, but my tail has two lobes like a whale's, and I graze on seagrass.`.split("\n").filter(Boolean);

A.push(...B.map((l,i)=>{const[n,m,t]=l.split("|");return[n.toLowerCase().replace(/[^a-z]/g,""),"",n,PAL[i%10],"Let me tell you my side.",m,"Let's bust it",[t]]}));
const BP=[["shark","Rows of sharp teeth that are replaced all life long"],["whale","Long grooves under the throat that stretch wide when feeding"],["octopus","Eight arms lined with suckers"],["jellyfish","Long, frilly tentacles trailing in the water"],["turtle","Paddle-shaped flippers and a domed shell"],["dolphin","A curved fin on its back"],["crab","Two big pincers"],["starfish","Five arms covered in tiny tube feet"],["seal","Whiskers and short flippers"],["orca","A tall fin and black-and-white patches"],["narwhal","A long spiral tusk"],["mantaray","A huge open mouth with two curled fins beside it"],["seahorse","A curled tail for gripping"],["pufferfish","A round body with spines"],["lobster","Long antennae and big claws"],["walrus","Long ivory tusks and bristly whiskers"],["penguin","Flipper-like wings"],["swordfish","A long, flat bill"],["hammerheadshark","A wide, flat head"],["nautilus","Dozens of thin tentacles reaching out"]];
const MORE=Object.fromEntries(`shark|I've been around for over 400 million years, older than trees. My skeleton is cartilage, my skin is covered in tiny tooth-like scales, and I can sense the faint electric field of a hidden fish. I lose and replace thousands of teeth in my life. I'm not a mindless hunter, I'm a precise one, and the ocean needs me.|fishing gear and finning
dolphin|I talk with clicks and whistles, and each of us has a signature whistle that works like a name. I live in a pod, hunt as a team, and help sick friends reach the surface to breathe. I sleep with half my brain at a time so I never forget to breathe. Smart doesn't mean simple, and it doesn't mean saintly either.|getting tangled in fishing nets
octopus|I have a small brain in each arm as well as the big one in my head, and my arms can taste what they touch. I squeeze through any gap bigger than my beak, and I escape tanks better than any fish. I only live a few years, so I spend them curious, solving puzzles and learning.|plastic trash and drifting nets in my den
jellyfish|I'm about ninety-five percent water, yet my family has survived many mass extinctions. I have no heart and no brain, just a net of nerves that senses light and touch. Some of my cousins can restart their life cycle when stressed. I move by gently pulsing my bell, and I'm food for turtles, fish and crabs.|polluted, warming water
turtle|I hatched on a beach at night and ran to the sea alone. Only a tiny number of hatchlings survive to adulthood, and it takes decades for me to grow up. I use Earth's magnetic field to navigate, and I can hold my breath for hours when resting. Every beach I return to is a promise to the next generation.|plastic bags that look like jellyfish
whale|I sing, I breathe through a blowhole, and my ancestors were land animals that walked on four legs millions of years ago. My family recycles the ocean: our waste feeds tiny plankton, and when we die our bodies feed the deep sea for decades. I'm not a monster, I'm a gardener of the sea.|ropes, fishing gear and fast ships
seal|I can nap underwater and hold my breath for long stretches. My thick whiskers feel the tiny waves left behind by a passing fish, even in the dark. A seal pup is born fluffy, but it learns to swim and hunt very fast. I look soft, but I'm built for cold seas, speed and survival.|fishing nets and plastic rings
crab|I carry my skeleton on the outside, so to grow I have to shed my shell and hide while the new one hardens. I sense chemicals with my legs, see with eyes on stalks, and wave my claws to talk. I'm small, but beaches and mudflats depend on my cleaning and digging.|plastic and pollution on my beach
starfish|I have no brain and no blood. Seawater moves through my body to carry oxygen and nutrients, and tiny eyespots at the tip of each arm sense light and dark. I can push my stomach out of my body to digest prey. Slow doesn't mean helpless: a sea star can shape a whole tide pool.|warming water and wasting disease
orca|I'm at the top of the food chain, and my family teaches me everything. Each pod has its own dialect and hunting traditions, passed from mothers to calves. Grandmothers lead the pod long after they stop having babies, which very few animals do. I live with my family for life, the opposite of a lonely villain.|pollution, loud ships and less food
mantaray|I can be wider than a car is long, and I have no stinger, only a gentle push through the water. I funnel plankton into my mouth with two flexible fins on my head. Some of us visit cleaning stations on the reef to be tidied by small fish. Scientists think I'm curious and clever.|fishing nets and swallowing plastic
stingray|I bury myself in sand so only my eyes show, and I breathe through holes on my back so I don't inhale sand. I look flat, but I'm a close relative of sharks, with a skeleton of cartilage. I glide above the seabed hunting shellfish and worms. I only want to hunt in peace.|fishing nets and shrinking habitats
clownfish|I'm born male, and if the female of my group disappears, the biggest male becomes female. I live in the same anemone for life, defending it from fish that want to nibble it. I fan its tentacles with fresh water and feed it with my waste. Home is everything to me, which is why a bleaching reef scares me.|hot water that bleaches my anemone home
seahorse|I have no stomach, so I eat almost all day, sucking up tiny shrimp with my snout. My eyes move independently. Each morning my partner and I greet each other with a dance. Dad carries the babies, and once they are born they are on their own. I'm not a toy, I'm a slow, careful survivor.|bottom trawling and the loss of my seagrass home
morayeel|I have a second set of jaws inside my throat that shoot forward to pull prey in. I can't see well, but my sense of smell is excellent. I open and close my mouth to pump water over my gills, which looks scary but is just breathing. Cleaner shrimp tidy my skin, so we get along fine.|lost traps and trash in my rocky home
barracuda|I can sprint in short bursts faster than most fish and strike in a flash. Young barracuda hide in mangroves and seagrass, then move out to the open reef as they grow. Silver and streamlined, I cruise in a school when I'm young and alone when I'm older. I'm a predator, but I'm not out to get you.|fishing nets and polluted reefs
pufferfish|I'm a slow swimmer, so I need a trick. When threatened, I stretch my elastic stomach and fill it with water until I'm a spiny ball. My fused teeth form a beak that never stops growing, so I crunch hard shells to wear it down. I'm clumsy, but clever. I'd rather not puff up at all.|plastic trash I might mistake for food
lionfish|I spread my fins like a fan to herd small fish into a corner. I'm native to the Indo-Pacific. In the Atlantic I'm an invader brought in by people, a problem I never chose. In my home waters, other animals keep my numbers balanced. I'm beautiful and venomous, but I'm not the villain of this story.|pollution and plastic on my reef
blueringedoctopus|I'm small, but my venom is made with help from bacteria living in my glands. I spend most of my day hiding in crevices, and my blue rings flash only when I'm threatened. I carry my eggs under my arms for months and don't eat while I guard them. I'm a shy mother, not a monster in the tide pool.|trash in my tide pool home
seaotter|I have the thickest fur of any animal, up to a million hairs in a square inch. I groom it constantly to trap air and stay warm. I eat about a quarter of my body weight each day, and I keep a favorite rock in a pocket under my arm. By hunting urchins, I protect kelp forests that shelter thousands of species.|oil spills that ruin my fur
walrus|I weigh over a tonne, yet I can dive deep and hold my breath for a long time. I'm very social and sleep in huge piles on the ice. My tusks keep growing all my life and help me climb onto the ice. I use my whiskers to find clams in murky mud. I need floating ice as a place to rest.|melting sea ice
manatee|I'm a slow, gentle plant-eater who spends hours each day grazing seagrass. I can eat about ten percent of my body weight daily. I come up to breathe every few minutes, but I can rest underwater for much longer. My distant relatives include elephants, and I live in warm, shallow water where boats travel fast.|speeding boats and cold, polluted water
narwhal|I live in the Arctic, mostly under thick sea ice. My tusk is a tooth that can be around two meters long, and scientists think it's packed with sensors. I dive very deep for fish and squid. Every winter I depend on a few small breathing holes in the ice.|a shrinking, noisy Arctic
beluga|I can swim backward, which most whales can't, and I can turn my head because my neck bones aren't fused. My forehead, called the melon, changes shape as I make sounds. I live in cold Arctic waters and sometimes swim into rivers. I'm born gray and slowly turn white as I grow up.|noise and pollution
humpbackwhale|I travel thousands of kilometers each year between cold feeding grounds and the warm waters where I have my calves. I blow nets of bubbles to trap fish, and my long flippers help me steer. The pattern under my tail is unique, and scientists use it like a fingerprint to know me. Other whales learn my song.|fishing ropes and nets
spermwhale|I dive deeper than almost any other mammal, more than a kilometer down, and I can stay under for over an hour. I hunt squid in the dark using clicks that are among the loudest sounds made by any animal. I live in family groups where females help raise one another's calves.|plastic and fishing nets that I swallow
whaleshark|I'm the biggest fish in the sea, and I eat some of the smallest things: plankton and tiny fish. My spots are unique, like a fingerprint. I can live for decades and travel across entire oceans. I have thousands of tiny teeth, but I never use them to bite. I filter, I don't chase.|ships and the plastic I filter
hammerheadshark|My wide head holds extra electric sensors that detect prey hidden in sand. My eyes sit at the ends, giving me almost a full-circle view. Some of us gather in huge schools during the day and hunt alone at night. Many of my young are born in shallow, safe nurseries near the coast.|nets and longlines
nurseshark|I use strong suction to pull prey out of crevices, and I rest in groups during the day, sometimes piled on each other. Small whisker-like barbels near my mouth help me feel for food. I'm slow, calm and mostly active at night. Divers often meet me asleep and leave me in peace.|fishing gear and trash on the reef floor
seaurchin|I have no eyes, but my whole body senses light. I move on hundreds of tube feet and scrape algae with a five-part mouth called Aristotle's lantern. My spines protect me, and some of us live for decades. I'm a gardener of the reef, keeping algae in check so coral can grow.|pollution and warming water
seacucumber|I breathe through my backside, and I can toss out some of my insides to distract a predator and regrow them later. I swallow sand to eat the tiny life in it, and I leave cleaner sand behind. I move slowly on tube feet and hide in plain sight. I'm a vacuum cleaner of the seafloor.|overfishing and dirty sand
seaanemone|I'm an animal that looks like a flower. I usually sit on rocks, but I can slowly glide on my foot if I'm unhappy. My stinging tentacles paralyze small prey, and some algae live inside me and share food. I can live for decades. Some fish live safely in my arms, so I'm a home as well as a hunter.|hot water that bleaches me
coral|I'm built by tiny polyps that make a limestone skeleton and live together in colonies. Reefs cover a tiny fraction of the ocean floor but shelter about a quarter of marine species. Algae living in my tissue give me color and food, which is why I turn white when I'm stressed. I take years to grow and moments to die.|hot water, pollution and plastic
sponge|I have no brain, no heart and no stomach, yet my family has lived on Earth for more than half a billion years. I pump huge amounts of water through my body every day and filter out bacteria. Some of my kind live for hundreds of years. I'm a living filter that keeps the water clean.|tiny plastic that clogs my pores
nautilus|I've lived in nearly the same shape for hundreds of millions of years. I live in a spiral shell divided into chambers, and I adjust the gas in them to rise or sink. I rise toward shallower water at night to feed and return to the deep by day. My shell is beautiful, and that is my curse.|being hunted for my shell
giantsquid|I have the largest eyes in the animal kingdom, about the size of a dinner plate, to spot sperm whales in the dark. Nobody filmed me alive in the deep until 2012. I'm not a kraken, I'm a shy deep-sea animal with two long feeding tentacles. I live far from your world, but your trash drifts into mine.|trash and noise drifting into the deep
cuttlefish|I have three hearts and blue-green blood, and my eyes have W-shaped pupils. I change color in a heartbeat even though I'm colorblind, and I flash patterns to talk with other cuttlefish. In tests, I've shown I can wait for a better treat, a sign of self-control. I'm a master of disguise because I have to be.|pollution and nets
hermitcrab|I have a soft body, so I borrow a shell for protection. When I find a larger shell, I wait in line with other crabs, and we trade up one by one. This swap chain is called a vacancy chain. I'm a recycler: someone else's old home is the perfect new home for me.|plastic caps and trash instead of shells
lobster|I taste with my legs, and my two claws are different: one crusher and one cutter. I live many years, and I keep growing as I shed my shell. My blood is blue because it contains copper. I hunt at night and hide in rock crevices by day. I'm not red until you cook me.|lost traps and warming water
mantisshrimp|My club strikes about as fast as a bullet from a small gun, and the water boils around it from the impact. My eyes have up to sixteen types of color receptors, compared to your three. I live in a burrow that I defend fiercely. People call me violent. I'm just very well equipped.|dying reefs and pollution
krill|I'm only a few centimeters long, but my swarms can stretch for kilometers. I travel up and down each day, eating algae at night and hiding in the deep by day. I'm the main meal for whales, penguins and seals, and I help move carbon to the deep sea. If I vanish, the whole food chain falls.|warming water and the plastic I swallow
barnacle|As a larva I swim free, but as an adult I glue myself headfirst to a rock, a whale or a boat for life. My glue is one of the strongest natural glues, and scientists study it. I sweep plankton into my mouth with feathery legs. I stick to my choices, literally.|polluted water
horseshoecrab|My blood is blue and contains cells that clump around bacteria, which is used to test medicines for safety. I'm older than the dinosaurs and have barely changed. I walk the seabed on ten legs and have many eyes. In spring I come ashore in huge groups to lay eggs, and migrating birds depend on them.|losing my nesting beaches
parrotfish|At night I wrap myself in a bubble of mucus, thought to hide my scent from predators. I scrape algae off coral with my beak and grind it up, then I make sand. When a school of us grazes, coral gets room to grow. Many of us change color and even sex as we grow.|overfishing and dying reefs
anglerfish|I live in the deep, where it's dark and food is scarce. The glowing lure on my head is lit by bacteria. In some species, the males are tiny and fuse to the female permanently. I can swallow prey as big as myself thanks to my stretchy stomach. I'm hungry, not hateful.|trash and noise sinking into the deep
flyingfish|I race along the surface and launch, spreading my big fins to glide. Some of my flights last for hundreds of meters, a few meters above the water. I do this to escape tuna, dolphins and swordfish. I'm not a bird, I'm a fish that found a way to leave the sea for a moment.|plastic floating on the surface where I glide
swordfish|I'm fast, with a smooth, torpedo-shaped body, and as an adult I have no scales or teeth. I warm my eyes and brain so I can hunt in cold, deep water. I dive deep by day and rise toward the surface at night. My long bill slices through schools of fish like a blade. I'm not a pirate.|fishing lines and overfishing
tuna|I'm built for speed and distance. I never stop swimming, and I keep my body warmer than the water around me, which powers my muscles. Some of us cross entire oceans each year and live for decades. I'm one of the ocean's great travelers, but I'm often seen only as food.|overfishing
oceansunfish|I'm the heaviest bony fish in the sea, and I have a rudder instead of a tail. I bask on my side at the surface to warm up after cold dives, and seabirds sometimes pick parasites off my skin. I start as a tiny larva and grow enormously. I'm an oddball, but I'm well built.|plastic bags that look like jellyfish
penguin|I'm a bird who traded flying for swimming, and my wings are strong flippers. In some of my family, we huddle in thousands to keep warm and take turns standing in the middle. Dads keep eggs warm on their feet for weeks. I waddle on land, but underwater I fly. Fish and krill are my food.|melting ice and empty seas
seasnake|I'm a reptile that breathes air, but I can stay under for a long time, and I even absorb some oxygen through my skin. My paddle tail helps me swim, and a gland gets rid of extra salt. I'm curious and may come close to divers, but I'm rarely aggressive. Please give me space.|trawl nets and polluted coasts
marineiguana|I'm the only lizard that feeds in the sea. I dive to graze on algae, then rest on warm black rocks to heat up. I sneeze out extra salt through special glands near my nose. In hard years, I can shrink my body to survive the lack of food. I live only in the Galapagos Islands.|oil spills and plastic washing up on my rocks
elephantseal|I can dive for more than an hour and go very deep. On land, males battle for the beach, but I spend most of my life at sea. I fast for weeks during breeding and molting season. I'm enormous, with the big nose that gave me my name, but I'm usually peaceful when left alone.|fishing nets and plastic
sealion|I can walk on all four flippers, and I'm louder than my seal cousins with a barking voice. I live in noisy colonies and I'm playful and curious. My ear flaps show that I'm a sea lion. I'm fast and agile in the water, and I slip past divers like a torpedo.|fishing nets and plastic rings
porpoise|I'm smaller than a dolphin, and my teeth are flat, not cone-shaped. I'm shy and avoid boats. I'm a quiet swimmer, and many of us live in cold coastal waters. I'm not the Flipper type. People often confuse me with my cousin, but I'm happy being a little less famous.|gillnets and noisy ships
cleanerwrasse|I run a tiny cleaning station on the reef. Big fish, even sharks and eels, come to me to have parasites removed. I dance to advertise my service. I'm one of the few fish said to pass a mirror test. I'm small, I'm smart, and the reef is healthier because of me.|dirty, dying reefs
remora|I carry a sucker on my head, which is actually a modified fin, to hitch a ride on sharks, rays, whales and turtles. I get free travel, safety and leftovers. I sometimes clean my host's skin. I'm not harmful to my host. I'm a hitchhiker who gives back.|plastic and the loss of my hosts
portuguesemanowar|I'm not one animal, I'm a colony of different kinds of tiny animals working together. My gas-filled float sails me across the ocean on the wind. My tentacles can reach many meters long and sting painfully. I drift in groups called fleets. Even washed up on a beach I can still sting, so please keep your distance.|plastic and polluted shores
nudibranch|I'm a sea slug with no shell, and I wear my gills outside like flowers. My bright colors are a warning, because some of us store stinging cells taken from our prey. I find food with my smell sensors, called rhinophores. I'm tiny, but I might be the most colorful animal in the sea.|pollution and warming seas
dugong|I graze on the seabed, and I leave long trails in the seagrass as I feed. I can live for decades but have very few babies, so we recover slowly. I'm a close relative of the manatee, and sailors may have told mermaid tales about me. I'm gentle, shy and slow.|fishing nets and lost seagrass meadows`.split("\n").map(l=>{const[i,p,f]=l.split("|");return[i,[p,f]]}));

home:()=>`<div class="hero" style="--a:#8fdcf0">${IMG.hero?`<img src="${IMG.hero}" alt="">`:`<span class="hl">Hero photo goes here (hero)</span>`}<div class="ht"><h1>You think you know them.</h1><p>Ocean animals are judged by stereotypes before anyone gets to know them. In this realm, 60 animals speak for themselves. Read their stories, test your knowledge, play the games, and see if your opinion changes.</p><a class="b" href="#animals">Meet the animals</a></div></div>

<div class="two">${slot(a[0]+"-main",a[2]+" main photo",a[3])}<div><div class="q">Common stereotype: "${a[5]}"<br><b>${a[6]}</b></div><p>${a[7][0]}</p></div></div>
${a[7][1]?`<p>${a[7][1]}</p>`:""}${MORE[a[0]]?`<p>${MORE[a[0]][0]}</p>`:""}${slot(a[0]+"-extra",a[2]+" natural behavior photo",a[3])}

const TH=["assets/img_35903e2ecb.jpg", "assets/img_f03e85efa0.jpg", "assets/img_5acd6d862f.jpg", "assets/img_bfb95015dc.jpg", "assets/img_6a9fb07d85.jpg", "assets/img_2984bbf3d9.jpg", "assets/img_6944949b87.jpg", "assets/img_2dea22d244.jpg", "assets/img_435393a055.jpg"];const THC=[["Stranded sea snake", "A beaked sea snake lying on the sand. Sea snakes breathe air, and many are caught by accident in fishing nets."], ["Frozen by the cold", "Cold-stunned iguanas collected after a cold snap in Florida. Reptiles can't warm themselves, so sudden cold can freeze them in place."], ["Caught in a net", "A seal wrapped in a discarded fishing net. Lost nets can cut skin and stop animals from swimming or hunting."], ["Fishing line wrapped tight", "Thin fishing line wrapped around a sea lion. Even a fine thread can cut deeper as an animal grows."], ["The vaquita", "A vaquita tangled in a gillnet. This small porpoise is critically endangered, and only a handful remain."], ["Nets that never stop", "A fish tangled in a net. Abandoned nets keep catching animals long after the fishermen are gone."], ["A shark lost", "A reef shark lying on the seabed with a deep wound. Millions of sharks die every year in fishing gear."], ["Washed ashore", "Blue by-the-wind sailors stranded on a beach. Wind and storms can push open-ocean animals onto the sand."], ["Look, but leave them", "A sea slug scooped into a plastic bag. Tide-pool animals are safest when we watch them and leave them where they live."]];

const ESSAY=`<div style="margin-top:1.5rem"><h2>Don't judge them by the stereotype</h2><p>Every animal on this site started as a stereotype: the shark as a killer, the dolphin as a perfect friend, the jellyfish as a stinger, the orca as a villain, the crab as a grump. Those pictures come from movies, headlines and fear, not from the animals themselves.</p><p>When we looked closer, the picture changed. Sharks don't hunt people, dolphins can be rough, octopuses recognize faces, turtles keep seagrass healthy, and starfish aren't even fish. Each animal is a living individual with its own behavior, its own role and its own story.</p><p>Whether your score went down, up or stayed the same, the point isn't to stop being careful. Some animals can hurt us, and respecting wildlife matters. The point is to base your opinion on facts, not on a label. Judging an animal by its stereotype is like judging a person by a rumor.</p><p>Unfair fear also has a cost: the less we understand an animal, the less we protect it. Learn the facts, share them, and keep the ocean clean, so every one of these animals gets a fair chance.</p></div>`;

I'm a heavyweight who dives deep for long stretches. Males like me can weigh over a tonne.|أنا من الوزن الثقيل، أغوص عميقاً لفترات طويلة. الذكور مثلي قد يزيد وزنها على طن.
I can dive for more than an hour and go very deep. On land, males battle for the beach, but I spend most of my life at sea. I fast for weeks during breeding and molting season. I'm enormous, with the big nose that gave me my name, but I'm usually peaceful when left alone.|أستطيع الغوص أكثر من ساعة والنزول عميقاً جداً. على اليابسة تتقاتل الذكور على الشاطئ، لكنني أقضي معظم حياتي في البحر. أصوم أسابيع في موسم التكاثر والانسلاخ. أنا ضخم، بالأنف الكبير الذي أعطاني اسمي، لكنني مسالم عادة إذا تُركت وشأني.
fishing nets and plastic|شباك الصيد والبلاستيك
I'm a cousin of seals. I have visible ear flaps, and I can walk on my big front flippers.|أنا ابن عم الفقمات. لدي صيوان أذن ظاهر، وأستطيع المشي على زعانفي الأمامية الكبيرة.
I can walk on all four flippers, and I'm louder than my seal cousins with a barking voice. I live in noisy colonies and I'm playful and curious. My ear flaps show that I'm a sea lion. I'm fast and agile in the water, and I slip past divers like a torpedo.|أستطيع المشي على زعانفي الأربع، وصوتي أعلى من صوت أبناء عمومتي الفقمات، فهو نباح. أعيش في مستعمرات صاخبة وأنا مرح وفضولي. صيوانا أذنيّ يدلان على أنني أسد بحر. أنا سريع ورشيق في الماء، وأنساب بين الغواصين كالطوربيد.

I'm smaller than a dolphin, and my teeth are flat, not cone-shaped. I'm shy and avoid boats. I'm a quiet swimmer, and many of us live in cold coastal waters. I'm not the Flipper type. People often confuse me with my cousin, but I'm happy being a little less famous.|أنا أصغر من الدلفين، وأسناني مسطحة لا مخروطية. أنا خجول وأتجنب القوارب. أسبح بهدوء، ويعيش كثير منا في المياه الساحلية الباردة. لست من نوع فليبر. يخلط الناس بيني وبين ابن عمي، لكنني سعيد بأن أكون أقل شهرة قليلاً.
gillnets and noisy ships|الشباك الخيشومية والسفن الصاخبة
I run a cleaning station on the reef, and big fish line up to have their parasites removed by me.|أدير محطة تنظيف في الشعاب، وتصطف الأسماك الكبيرة لأزيل عنها طفيلياتها.
I run a tiny cleaning station on the reef. Big fish, even sharks and eels, come to me to have parasites removed. I dance to advertise my service. I'm one of the few fish said to pass a mirror test. I'm small, I'm smart, and the reef is healthier because of me.|أدير محطة تنظيف صغيرة في الشعاب. تأتي إليّ أسماك كبيرة، حتى القروش والثعابين البحرية، لأزيل طفيلياتها. أرقص للإعلان عن خدمتي. أنا من الأسماك القليلة التي يقال إنها تجتاز اختبار المرآة. أنا صغير وذكي، والشعاب أكثر صحة بفضلي.
dirty, dying reefs|الشعاب المتسخة المحتضرة
I hitch rides on sharks with my suction disc, and I eat the scraps and parasites. Everyone gets a meal.|أتنقل على ظهور القروش بقرص الشفط الخاص بي، وآكل البقايا والطفيليات. الجميع يحصل على وجبة.
I carry a sucker on my head, which is actually a modified fin, to hitch a ride on sharks, rays, whales and turtles. I get free travel, safety and leftovers. I sometimes clean my host's skin. I'm not harmful to my host. I'm a hitchhiker who gives back.|أحمل ممصّاً على رأسي، وهو في الحقيقة زعنفة متحوّرة، لأستقل القروش وأسماك الراي والحيتان والسلاحف. أحصل على سفر مجاني وأمان وبقايا طعام. وأنظّف جلد مضيفي أحياناً. لا أؤذي مضيفي. أنا راكب يرد الجميل.
plastic and the loss of my hosts|البلاستيك وفقدان مضيفيّ
I'm actually a colony of tiny animals working together as one, and my tentacles can sting painfully.|أنا في الحقيقة مستعمرة من حيوانات صغيرة تعمل معاً ككائن واحد، ويمكن لمجساتي أن تلسع بشدة.
I'm not one animal, I'm a colony of different kinds of tiny animals working together. My gas-filled float sails me across the ocean on the wind. My tentacles can reach many meters long and sting painfully. I drift in groups called fleets. Even washed up on a beach I can still sting, so please keep your distance.|أنا لست حيواناً واحداً، بل مستعمرة من أنواع مختلفة من الحيوانات الصغيرة تعمل معاً. يبحر بي عوّامي المملوء بالغاز عبر المحيط مع الريح. يمكن أن يصل طول مجساتي إلى عدة أمتار وتلسع بألم. أنساب في مجموعات تسمى أساطيل. حتى وأنا جانح على الشاطئ أستطيع اللسع، فابتعد من فضلك.
plastic and polluted shores|البلاستيك والشواطئ الملوثة
I'm a colorful sea slug, and some of us even recycle stinging cells from the animals we eat.|أنا حلزون بحر ملوّن، وبعضنا يعيد تدوير الخلايا اللاسعة من الحيوانات التي يأكلها.
I'm a sea slug with no shell, and I wear my gills outside like flowers. My bright colors are a warning, because some of us store stinging cells taken from our prey. I find food with my smell sensors, called rhinophores. I'm tiny, but I might be the most colorful animal in the sea.|أنا حلزون بحر بلا صدفة، وأرتدي خياشيمي في الخارج كالأزهار. ألواني الزاهية تحذير، لأن بعضنا يخزّن خلايا لاسعة أخذها من فريسته. أجد الطعام بمستشعرات الشم عندي، وتسمى رينوفورات. أنا صغير، لكنني قد أكون أكثر حيوان ملوّن في البحر.
pollution and warming seas|التلوث وارتفاع حرارة البحار
I'm a cousin of manatees, but my tail has two lobes like a whale's, and I graze on seagrass.|أنا ابن عم خراف البحر، لكن لذيلي فصّين كذيل الحوت، وأرعى أعشاب البحر.
I graze on the seabed, and I leave long trails in the seagrass as I feed. I can live for decades but have very few babies, so we recover slowly. I'm a close relative of the manatee, and sailors may have told mermaid tales about me. I'm gentle, shy and slow.|أرعى على قاع البحر وأترك مسارات طويلة في أعشاب البحر وأنا أتغذى. أستطيع العيش عقوداً لكن صغاري قليلون جداً، فنتعافى ببطء. أنا قريب من خروف البحر، وربما رُويت حكايات حوريات البحر عني. أنا وديع وخجول وبطيء.
fishing nets and lost seagrass meadows|شباك الصيد وفقدان مروج أعشاب البحر`));
